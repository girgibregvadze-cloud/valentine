<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine?</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap');

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: 'Poppins', sans-serif;
}

.container {
  background: rgba(255,255,255,0.95);
  padding: 24px;
  border-radius: 20px;
  text-align: center;
  width: 92%;
  max-width: 380px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.25);
}

h1 {
  font-family: 'Pacifico', cursive;
  color: #d81b60;
  font-size: 32px;
}

p {
  color: #555;
  margin-bottom: 18px;
}

img {
  width: 180px;
  border-radius: 16px;
  margin-bottom: 20px;
}

.buttons {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

button {
  flex: 1;
  border: none;
  border-radius: 999px;
  padding: 16px;
  font-size: 18px;
  cursor: pointer;
  transition: transform 0.25s ease, font-size 0.25s ease;
}

#yes {
  background: #4caf50;
  color: white;
}

#no {
  background: #f44336;
  color: white;
}

.hidden {
  display: none;
}

/* Success page */
#success h1 {
  font-size: 36px;
}

#success img {
  width: 220px;
}
</style>
</head>

<body>

<!-- Music (starts after first tap) -->
<audio id="music" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg">
</audio>

<!-- PAGE 1 -->
<div class="container" id="ask">
  <h1>Will you be my Valentine? 💘</h1>
  <p>Choose wisely 😌</p>
  <img src="https://media.tenor.com/0AVbKGY_MxMAAAAC/cute-cat.gif" alt="cute cat">

  <div class="buttons">
    <button id="yes">Yes 💖</button>
    <button id="no">No 💔</button>
  </div>
</div>

<!-- PAGE 2 -->
<div class="container hidden" id="success">
  <h1>YAY!!! 💕</h1>
  <p>Best decision ever 😏</p>
  <img src="https://media.tenor.com/9N1yR8b1c1YAAAAC/happy-cat.gif" alt="happy cat">
</div>

<script>
const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");
const askPage = document.getElementById("ask");
const successPage = document.getElementById("success");
const music = document.getElementById("music");

let yesSize = 18;
let musicStarted = false;

// Start music on first tap (mobile-safe)
document.body.addEventListener("click", () => {
  if (!musicStarted) {
    music.play();
    musicStarted = true;
  }
});

// When NO is clicked → YES grows
noBtn.addEventListener("click", () => {
  yesSize += 6;
  yesBtn.style.fontSize = yesSize + "px";
  yesBtn.style.transform = "scale(1.1)";

  const texts = ["No 💔", "Are you sure? 😅", "Really? 😭", "JUST YES 😡"];
  noBtn.innerText = texts[Math.min((yesSize - 18) / 6, texts.length - 1)];
});

// YES clicked → win
yesBtn.addEventListener("click", () => {
  askPage.classList.add("hidden");
  successPage.classList.remove("hidden");
});
</script>

</body>
</html>
